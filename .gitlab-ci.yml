# GitLab CI — this is the pipeline that runs on the repo a grader actually receives.
#
# `origin` has two push URLs and the PRD's submission row is "GitLab Repository", so a gate that only exists as a
# GitHub Actions workflow does not exist as far as grading is concerned. Everything here runs offline: no network,
# no API key, no OpenEMR container. Model responses are replayed from evals/w2/recordings (see evals/w2/replay.py).
#
# If this pipeline sits perpetually "pending", this project has no available runner — that reads worse than no
# pipeline at all. In that case the README's one-command gate is authoritative; say so in W2_ARCHITECTURE.md
# rather than leaving a grey badge.

stages:
  - test
  - gate

default:
  image: python:3.12-slim
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .pipcache
  before_script:
    - pip install --quiet --cache-dir .pipcache -r agent/requirements.txt -r agent/requirements-dev.txt

variables:
  # The agent reads these; none is a real credential. The suite never reaches the network.
  ANTHROPIC_API_KEY: "dummy"
  LANGFUSE_TRACING_ENABLED: "false"
  LLM_WARMUP: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

offline-tests:
  stage: test
  script:
    - cd agent && python -m pytest -q -p no:cacheprovider tests

eval-gate:
  stage: gate
  script:
    # 1. The replay layer's own checks. If an edited prompt stops being a hard failure, nothing below means anything.
    - python evals/w2/test_replay.py
    # 2. Prove the runner can go red. Passes ONLY if the known-bad case fails.
    - python evals/w2/run_gate.py --selftest
    # 3. The gate itself: floors, and no category regressing more than 5% against the committed baseline.
    - python evals/w2/run_gate.py
