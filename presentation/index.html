<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evidence Over Confidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;1,400&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#F5F7F9; --surface:#FFFFFF; --surface-2:#EDF1F5;
  --ink:#141D26; --ink-2:#3D4E5E; --muted:#6B7F91;
  --rule:#D9E1E8; --rule-strong:#BDCAD6;
  --signal:#B9691F; --signal-soft:#F5E6D6;
  --pass:#2B6E54; --pass-soft:#DDEDE5;
  --fail:#A5342A; --fail-soft:#F6E0DD;
  --term-bg:#111A23; --term-ink:#D7E3ED; --term-dim:#7C93A6;
  --shadow:0 1px 2px rgba(20,29,38,.06), 0 8px 24px rgba(20,29,38,.07);
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --serif:"IBM Plex Serif", Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0C131A; --surface:#141E28; --surface-2:#1B2733;
    --ink:#E4EDF4; --ink-2:#B6C7D5; --muted:#7E94A6;
    --rule:#243341; --rule-strong:#34485A;
    --signal:#DFA15C; --signal-soft:#2A2016;
    --pass:#5CC195; --pass-soft:#12261E;
    --fail:#E4786A; --fail-soft:#2A1613;
    --term-bg:#080E14; --term-ink:#D7E3ED; --term-dim:#6E8496;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0C131A; --surface:#141E28; --surface-2:#1B2733;
  --ink:#E4EDF4; --ink-2:#B6C7D5; --muted:#7E94A6;
  --rule:#243341; --rule-strong:#34485A;
  --signal:#DFA15C; --signal-soft:#2A2016;
  --pass:#5CC195; --pass-soft:#12261E;
  --fail:#E4786A; --fail-soft:#2A1613;
  --term-bg:#080E14; --term-ink:#D7E3ED; --term-dim:#6E8496;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}

/* ---------- chrome ---------- */
#bar{
  position:fixed; inset:0 0 auto 0; height:3px; background:var(--rule);
  z-index:60;
}
#bar i{display:block;height:100%;background:var(--signal);width:0;transition:width .25s ease}

#top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 20px; background:color-mix(in srgb, var(--ground) 92%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--rule);
}
#top .brand{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); white-space:nowrap;
}
#top .spacer{flex:1}
.ctl{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 11px; border:1px solid var(--rule-strong); border-radius:6px;
  background:var(--surface); cursor:pointer; font-size:13px; font-weight:500;
}
.ctl:hover{border-color:var(--signal)}
.ctl:focus-visible{outline:2px solid var(--signal); outline-offset:2px}
.ctl[aria-pressed="true"]{background:var(--signal-soft); border-color:var(--signal); color:var(--signal)}
.counter{font-family:var(--mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.clock{font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums; color:var(--ink-2)}
.clock.over{color:var(--fail); font-weight:600}

/* ---------- stage ---------- */
main{padding:0 20px 40px; max-width:1180px; margin:0 auto}
.slide{display:none}
.slide.on{display:block; animation:in .28s ease both}
@keyframes in{from{opacity:.4; transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .slide.on{animation:none} }

.deck{
  background:var(--surface); border:1px solid var(--rule); border-radius:12px;
  box-shadow:var(--shadow); padding:34px 34px 30px; margin-top:22px;
  min-height:390px;
}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--signal); margin:0 0 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.eyebrow .tick{color:var(--muted); letter-spacing:.06em}
h1{
  font-size:clamp(28px,4.4vw,46px); line-height:1.08; margin:0 0 6px; letter-spacing:-.022em;
  font-weight:700; text-wrap:balance;
}
h2{
  font-size:clamp(22px,3.1vw,33px); line-height:1.14; margin:0 0 16px; letter-spacing:-.018em;
  font-weight:600; text-wrap:balance;
}
.sub{font-size:clamp(15px,1.8vw,19px); color:var(--ink-2); margin:0 0 20px; max-width:62ch}
ul.pts{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px}
ul.pts li{
  position:relative; padding-left:20px; font-size:16.5px; color:var(--ink-2); max-width:70ch;
}
ul.pts li::before{
  content:""; position:absolute; left:2px; top:.62em; width:7px; height:2px; background:var(--signal);
}
ul.pts li b,ul.pts li strong{color:var(--ink); font-weight:600}
code{font-family:var(--mono); font-size:.9em; background:var(--surface-2); padding:1px 5px; border-radius:4px}

.quote{
  font-family:var(--serif); font-size:clamp(18px,2.4vw,25px); line-height:1.36;
  color:var(--ink); border-left:3px solid var(--signal); padding:4px 0 4px 18px; margin:22px 0 0;
  max-width:60ch; text-wrap:balance;
}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start}
@media (max-width:820px){ .grid2{grid-template-columns:1fr} }

/* ---------- data bits ---------- */
table.rub{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
table.rub th{
  text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); font-weight:500; padding:0 10px 7px 0; border-bottom:1px solid var(--rule);
}
table.rub td{padding:7px 10px 7px 0; border-bottom:1px solid var(--rule); color:var(--ink-2)}
table.rub td.k{font-family:var(--mono); color:var(--ink); font-size:13px}
table.rub td.v{font-family:var(--mono); color:var(--pass); font-weight:600}
.wrap-x{overflow-x:auto; -webkit-overflow-scrolling:touch}

.stat{display:flex; gap:26px; flex-wrap:wrap; margin-top:4px}
.stat div{min-width:96px}
.stat .n{font-family:var(--mono); font-size:clamp(22px,3vw,30px); font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--mono); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin-top:3px}

pre.term{
  background:var(--term-bg); color:var(--term-ink); border-radius:9px; padding:16px 18px; margin:0;
  font-family:var(--mono); font-size:12.5px; line-height:1.58; overflow-x:auto; border:1px solid var(--rule-strong);
}
pre.term .p{color:var(--term-dim)}
pre.term .ok{color:#6FD3A4}
pre.term .no{color:#F08878}
pre.term .hi{color:#E7B571}
.cap{font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:8px; letter-spacing:.03em}

/* screenshot slot */
.shot{
  border:1px dashed var(--rule-strong); border-radius:9px; background:var(--surface-2);
  min-height:200px; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center;
  overflow:hidden;
}
.shot img{max-width:100%; max-height:60vh; height:auto; display:block; border-radius:5px}
.shot .ph{max-width:46ch}
.shot .ph .f{font-family:var(--mono); font-size:12px; color:var(--signal); margin-bottom:7px; word-break:break-all}
.shot .ph .d{font-size:13.5px; color:var(--muted); line-height:1.45}

/* ---------- notes ---------- */
#notes{
  margin:18px 0 0; border:1px solid var(--rule); border-left:3px solid var(--signal);
  border-radius:9px; background:var(--surface); padding:20px 22px;
}
#notes h3{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted); margin:0 0 12px; font-weight:500;
}
#notes .script{font-size:18px; line-height:1.62; color:var(--ink); max-width:68ch; margin:0}
#notes .script em{font-style:normal; background:var(--signal-soft); color:var(--signal); padding:0 3px; border-radius:3px}
.cue{
  margin-top:15px; padding-top:13px; border-top:1px dashed var(--rule-strong);
  display:flex; gap:11px; align-items:baseline; flex-wrap:wrap;
}
.cue .tag{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  background:var(--signal); color:#fff; padding:3px 8px; border-radius:4px; white-space:nowrap;
}
.cue .txt{font-family:var(--serif); font-style:italic; color:var(--ink-2); font-size:15.5px}
.doing{margin-top:13px; font-size:14px; color:var(--muted)}
.doing b{color:var(--ink-2); font-weight:600}

/* ---------- nav ---------- */
#nav{display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:18px; flex-wrap:wrap}
#dots{display:flex; gap:5px; flex-wrap:wrap}
#dots button{
  width:9px; height:9px; padding:0; border-radius:50%; border:1px solid var(--rule-strong);
  background:transparent; cursor:pointer;
}
#dots button[aria-current="true"]{background:var(--signal); border-color:var(--signal); transform:scale(1.25)}
#dots button:focus-visible{outline:2px solid var(--signal); outline-offset:2px}

/* ---------- interview overlay ---------- */
#iv{
  position:fixed; inset:0; z-index:70; background:var(--ground); overflow-y:auto; padding:0 20px 60px;
}
#iv .inner{max-width:880px; margin:0 auto}
#iv header{
  position:sticky; top:0; background:color-mix(in srgb, var(--ground) 93%, transparent);
  backdrop-filter:blur(8px); padding:16px 0 12px; border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:14px; margin-bottom:26px;
}
#iv h2{margin:0; font-size:22px}
.qgroup{margin-bottom:34px}
.qgroup > h3{
  font-family:var(--mono); font-size:11px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--signal); margin:0 0 14px; padding-bottom:7px; border-bottom:1px solid var(--rule);
}
details.q{border:1px solid var(--rule); border-radius:8px; background:var(--surface); margin-bottom:10px; overflow:hidden}
details.q summary{padding:13px 16px; cursor:pointer; font-weight:600; font-size:15.5px; list-style:none}
details.q summary::-webkit-details-marker{display:none}
details.q summary::before{content:"▸ "; color:var(--signal); font-weight:400}
details.q[open] summary::before{content:"▾ "}
details.q summary:focus-visible{outline:2px solid var(--signal); outline-offset:-2px}
details.q .body{padding:0 16px 16px; border-top:1px solid var(--rule)}
.ans{margin-top:13px}
.ans .lab{
  font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  padding:2px 7px; border-radius:4px; display:inline-block; margin-bottom:6px;
}
.ans.good .lab{background:var(--pass-soft); color:var(--pass)}
.ans.bad .lab{background:var(--fail-soft); color:var(--fail)}
.ans.probe .lab{background:var(--surface-2); color:var(--muted)}
.ans p{margin:0; font-size:15px; color:var(--ink-2); line-height:1.58}

.hint{font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:26px; text-align:center; letter-spacing:.03em}
kbd{
  font-family:var(--mono); font-size:11px; border:1px solid var(--rule-strong); border-bottom-width:2px;
  border-radius:4px; padding:1px 5px; background:var(--surface); color:var(--ink-2);
}
</style>
</head>
<body>
<div id="bar"><i></i></div>

<div id="top">
  <span class="brand">Clinical Co-Pilot · Week 2</span>
  <span class="spacer"></span>
  <span class="clock" id="clock">0:00 / 5:16 core</span>
  <span class="counter" id="count">1 / 15</span>
  <button class="ctl" id="bNotes" aria-pressed="true">Notes</button>
  <button class="ctl" id="bIv">Interview prep</button>
  <button class="ctl" id="bTheme">Theme</button>
</div>

<main>
  <div id="stage"></div>
  <div id="notes"></div>
  <div id="nav">
    <div style="display:flex;gap:10px">
      <button class="ctl" id="bPrev">← Back</button>
      <button class="ctl" id="bNext">Next →</button>
    </div>
    <div id="dots"></div>
  </div>
  <p class="hint">
    <kbd>→</kbd> / <kbd>Space</kbd> next · <kbd>←</kbd> back · <kbd>N</kbd> notes · <kbd>I</kbd> interview prep · <kbd>T</kbd> theme · <kbd>R</kbd> reset timer
  </p>
</main>

<div id="iv" hidden></div>

["The dashboard migration (React 19 + TypeScript + Vite over a BFF)", [
  ["You replaced a working server-rendered PHP page with React 19, TypeScript 6 and Vite 8 — a Node build step, a second deploy artifact, and 80.9 kB of gzipped JavaScript where the old page shipped zero. HTMX would have given you independent panel swaps against those same FHIR endpoints for a fraction of that and no build step, and Svelte would have shipped less than React. So tell me why this isn't resume-driven development.",
   "Because the thing I was buying wasn't React, it was the type checker, and neither HTMX nor a smaller framework gets me that. FHIR is optional-heavy by specification: a patient's name is `name[0].family` where `name` may be absent, may be an array with different `use` values, or may carry only `text`. In the PHP page a missing name was a blank space discovered by a clinician at runtime. In `dashboard/src/fhir.ts` every field is declared optional, so code that ignores the absent case is a build error. That's the categorical win and I'd defend it over any framework argument. React specifically bought me two things: TanStack Query, because six independent async reads with caching, staleness, retry and per-card error states is a server-state problem and that library is the mature answer to it; and handover, because this is a fork of a twenty-five-year-old project that outlives whoever touches it. I'll concede the framework point directly: Svelte would ship a smaller bundle and would have been defensible, and if the only requirement were independent panel loads, HTMX would have been the lazier correct answer. HTMX doesn't clear the bar because it still needs a server rendering fragments — which, given the OAuth constraint, is the same server-side hop I ended up with anyway, minus the compiler.",
   "React is the industry standard and has the biggest ecosystem, so it's the safest choice for a project that needs long-term maintenance. Vue and Svelte are smaller communities and harder to hire for.",
   "If TypeScript is the actual win, why do you need a framework at all? Six fetches and template literals in a typed file gets you the compiler and ships nothing. Name what React earns on top of TanStack Query — and if the answer is 'TanStack Query', then you picked React for a library."],
  ["The backend-for-frontend reads like you couldn't get OAuth working in the browser, so you moved the token onto a server you already controlled and wrote a doc explaining why that was the plan all along. Convince me this is an architecture decision and not an obstacle you routed around.",
   "It isn't a decision, and I'd rather be precise about that than claim credit for it. OpenEMR refuses to *register* the client — the rejection is at dynamic client registration, not at the token request. `src/RestControllers/AuthorizationController.php` gates on `application_type !== 'private'` at line 312 and then, at 324-329, throws `OAuthServerException(..., 'invalid_client_metadata')` for any scope containing `user/` or `system/`. A browser app can't hold a client secret, so it registers public, so it never gets to ask for `user/AllergyIntolerance.rs`. And before you ask why I didn't just fix the scopes: `git log -1` on that file returns only `ef3d490 chore: initial import from OpenEMR master (pruned base)`. It's untouched upstream code. This is the platform refusing, not a configuration choice we made. `patient/` scopes would register, but that's the patient-portal persona and a narrower view than a clinician needs. So the token has to live on a server, and the IETF's current browser-app guidance says the same thing for the same reason. The one credit I'll take is not writing a second auth path: the BFF is 95 lines in `agent/copilot/dashboard_routes.py` and adds zero auth code, reusing `smart.py`'s PKCE, `sessions.py`'s server-side tokens and `fhir.py`'s patient lock — all already inside the 55-case gate. The cost is real and I'll name it: this screen now dies when the agent dies, where the PHP page only died when OpenEMR did, and there's one more hop per card.",
   "A BFF is the recommended pattern for browser-based apps — the IETF best-practice doc says not to store tokens in the browser, so this is the standard architecture rather than a workaround.",
   "So a read-only clinical screen is now on the critical path of your AI agent — the same process doing 90-second document ingest. When that agent OOMs mid-shift, the chart goes dark. Why are those 95 lines in the agent instead of their own process, and what's your availability argument?"],
  ["You dismissed server rendering in one paragraph, and your own write-up admits you never measured against the page you replaced — 'faster than PHP is not a claim I will make.' So you shipped a rewrite with no comparative number. What did the user actually get for 262 kB of JavaScript?",
   "Not speed — I have no evidence for speed and I won't assert it. What they got is failure isolation and honest states. The PHP page rendered every panel in one server-side pass, so the slowest query set the latency of the whole screen and one bad query could empty it. Now each card owns its request — `useQuery({queryKey: ['card', cardKey], staleTime: 30_000})` in `Card.tsx` — with an 8-second per-card deadline (`CARD_DEADLINE_S`, deliberately not the 90-second ingest deadline), so a slow Care Team is a slow Care Team and the other five are already interactive. There's a test for exactly that: Care Team returns 500 upstream and the route still answers 200 with a status the UI renders as 'unavailable'. The honest numbers, since you asked for them: Vite reports 262.10 kB raw / 80.91 kB gzipped JS, 1.81 kB CSS, 0.57 kB HTML — 83.3 kB gzipped total transfer, 64 modules, 119 ms build. The whole front end is 759 lines across six files with three runtime dependencies. On SSR: everything this screen renders is already a JSON endpoint, and the screen is behind authentication, so there's no SEO, no social preview and no anonymous first paint to optimise. A rendering tier would be a second server whose only job is fetching that JSON. What I concede is the measurement gap — a cold-cache first open is strictly worse than PHP, and for a page a clinician visits rarely this is the wrong trade. It's the right trade for a chart opened dozens of times a day on a warm cache, and that's an argument, not a measurement.",
   "80.9 kB gzipped is very small for a React app — most production React bundles are several hundred kB. And the client-side cache means refreshing one card doesn't reload the page, so it's faster in practice.",
   "Name the number that would make you conclude you made it worse, and tell me how you'd collect it in this deployment. If you can't answer that, you don't have a performance argument — you have a preference."],
  ["You call splitting 'empty' from 'unavailable' a deliberate divergence and a win. Here's my problem: a clinician reads 'No allergies recorded', prescribes, and the patient reacts. If your BFF ever misclassifies a failure as empty, your improvement is the thing that hurt someone. Why is inventing a state safer than the PHP page's single ambiguous panel?",
   "Because the direction of the ambiguity is what matters, and PHP's default was the dangerous one — it showed an empty panel whether the chart recorded nothing or the query failed, so every failure already read as 'no allergies'. I didn't add a risk, I split one that was already there and made the failure loud. There are five states in `Card.tsx`, not three: loading, error with a Retry button, `forbidden` ('Your role does not permit viewing X'), `expired` ('Session expired. Relaunch from the chart.'), and `empty`. A failure renders `state fail` with an 'unavailable' badge; only `empty` renders the count badge and 'No X recorded.' The comment in the code says it outright — 'None recorded' is a statement about the chart and is deliberately not the same UI as a failure. Both directions are pinned by tests, and an unknown card key returns 404 `unknown_card`, not a silently empty card. The residual risk you're pointing at is real and I'll name it: I do not distinguish 'this chart has no allergies' from 'this deployment doesn't expose the allergy module' or 'the scope was narrowed so the bundle came back empty'. All three read `empty` today. That's the remaining ambiguity and it deserves different wording, because it's the one case where my confident message is worse than PHP's vague one.",
   "We show strictly more information than the original UI did, so it can only be an improvement — the clinician now knows whether the query failed instead of guessing.",
   "Show me the case where FHIR returns 200 with an empty bundle because the scope was narrowed rather than because the chart is empty. What does your card say, and what does the clinician do next?"],
  ["Your own 'what I'd do next' says a patient with 200 problems renders 200 DOM nodes. Fine — but that's the least interesting scaling problem here. Six parallel FHIR reads per page open, an 8-second per-card deadline, `refetchOnWindowFocus` on, retry set to 1. Tell me what actually breaks first when this goes from you to four hundred clinicians.",
   "The agent breaks first, not the browser. Every dashboard open fans out to six concurrent FHIR fetches through one process, and because each card holds a connection up to the 8-second deadline, a slow OpenEMR converts into held connections on my side rather than fast failures. Then `refetchOnWindowFocus: true` multiplies it — a clinician alt-tabbing between the chart and a phone call re-fetches every stale card, and `staleTime` is only 30 seconds, so most of those tab-returns are real fetches. `retry: 1` means a flaky upstream is 2x the requests, not 1x. So the ordering I'd expect is: agent connection saturation, then OpenEMR's FHIR endpoint, then DOM size, which is the last thing to bite and the easiest to fix. The concession: I have no load test of this path. `LOAD_TEST.md` covers the agent's ingest path, not six-card fan-out, so everything I just said is reasoning from the code, not a measured curve. Before four hundred users I'd want a short-TTL server-side cache in the BFF keyed on session plus card, because six clinicians opening the same patient during rounds is six identical FHIR bundles today, and I'd revisit refetch-on-focus, which I tuned for a clinician staring at a spinner and not for a fleet.",
   "Virtualising the long lists is the main fix, plus adding caching — TanStack Query already caches client-side with a 30-second staleTime, so most opens won't hit the server.",
   "You just said the cache is per-browser. Rounds: six clinicians open the same patient in ten minutes. How many identical FHIR bundles does OpenEMR serve, and where would you put the cache that fixes it without you becoming a stale-clinical-data bug?"]
]],
["The eval gate's blind spot (the regression that walked through)", [
  ["Your entire quality story is a 55-case gate keyed on the request surface. You then put the extraction instruction in a message block — which the key deliberately excludes, a fact you documented yourself at `replay.py:24-27`. You wrote the rule and then shipped the most load-bearing prompt in the system outside it. How did you not know?",
   "Because I wrote that exclusion to solve a different problem and never checked the inverse. `messages` is out of the key on purpose: it carries case content, and hashing it would mean any fixture tweak invalidated every recording. That reasoning is correct. What I never wrote down was the other half — that nothing semantically load-bearing may live in `messages` — and so the extraction instruction sat in the trailing user content block of `read_document` for as long as it did, completely invisible to the hash. The surface key covers model, max_tokens, system, tools, tool_choice and output_config; my instruction was in the one field designed to be ignored. And I want to be straight about how I found it: I set out to *demonstrate* the gate catching a regression, corrupted the extraction prompt on a branch, and the gate went green across all 55 cases with all eight rubrics at 1.000. I found my own blind spot by trying to show off, which is luck, not process. The fix was moving the instruction to `system=INSTRUCTION[doc_type] + COMMON` in `extract.py:110` with the reason in a comment above it, touching zero lines of `replay.py` — the mechanism was always right, the payload was in the wrong envelope.",
   "It was a one-line placement oversight. We caught it, moved the prompt into the system field, re-recorded, and the gate works correctly now — all 55 cases pass and the regression is blocked.",
   "Your first demo went green on a corrupting prompt. Your second turned the pipeline red for the wrong reason — a unit test you'd written pinning prompt wording failed, `agent:gate` was skipped, and the gate never fired. That's two failed attempts to demonstrate your own quality control. Why should I trust the third?"],
  ["`messages` is out of the key. `timeout` is out of the key. Convince me `system` was the only place behavior was hiding — and don't tell me you looked.",
   "I can't tell you it's the only place, because it isn't. Here's the actual boundary. In the key, sha256 truncated to 16 hex: model, max_tokens, system text, tools, tool_choice, output_config. Outside it: message content, deliberately; `timeout`, because it's a fresh float from `deadline.remaining()` every run; `cache_control`, which `_system_text` strips so a caching change doesn't invalidate recordings; and — this is the one that matters — everything after the response. Parsers, validators and the rubric code in `run_gate.py` are not hashed at all, and neither is anything upstream that shapes the messages, like retrieval and ranking. Message content being out is defensible because fixtures are version-controlled, so changing one is a visible diff in review rather than a silent behavior change; a retrieval-ranking change that alters what goes into those messages is *not* a visible diff in the fixtures, and that's a genuine hole. Post-response code is covered only by the 408 unit tests, which is a weaker guarantee than the hash, and `cache_control` being stripped is correct today only because it doesn't change what the model receives — the day it does, the gate goes blind again. So: `system` was the biggest gap, not the only one, and I'd rather give you that list than pretend the perimeter is closed.",
   "Everything that affects model behavior is in the surface hash now — model, max_tokens, system, tools, tool_choice and output_config. That's the complete set of parameters that change what the model sees.",
   "Your rubric code isn't hashed. So what stops me from turning 15 red cases green by loosening a rubric in `run_gate.py` — and what in your pipeline would show me doing it?"],
  ["Right. The prompt is in `system` now. How do you know it's still there tomorrow, and how do you know the twelve other places in this codebase that call the model aren't making the same mistake today? 'I checked' is not an answer.",
   "For `extract.py` I have a mechanism, not a memory: `test_extract.py:181-183` asserts `system` is non-empty and that no text block appears in `messages`. Placement is pinned by a test that fails if anyone moves the instruction back. And there's a deliberate omission in that test worth explaining — I originally asserted the prompt's *wording* there ('EXACTLY as printed' appears in system), and I removed it in `84b4b45`, because a unit test pinning wording duplicates the surface hash and pre-empts the exact mechanism built to catch wording changes. The comment says it: wording is the gate's job, placement is this test's job. That's also what my second demo attempt taught me — that wording assertion is what turned the pipeline red at `agent:tests` and skipped `agent:gate` entirely, so my gate never got to prove anything. Now the hard part of your question: that's one call site, pinned by one hand-written test. There is no generic check that every `client.messages.create` in this tree puts its instruction in `system`, and that's what should exist — an AST pass over the repo asserting no call site carries instruction text in a message block. It doesn't exist. So I know `extract.py` is right and I'm asserting, not proving, for everything else.",
   "There's a unit test asserting the prompt is in the system field, and the gate covers all 55 cases — between those two the placement is locked in.",
   "Write me that AST check on the whiteboard. What exactly does it assert, and name the call sites you expect to fail it today."],
  ["Let's talk about what your gate actually did. It failed 15 cases on a cache miss — a hash mismatch. You'd get identical red from bumping `max_tokens` or fixing a typo in the prompt. That's not catching a regression, that's a checksum yelling because you edited a file. Defend the claim that your gate caught anything.",
   "You're largely right about the mechanism, and the interesting part is that it's the mechanism working, not failing. Look at what the failing artifact actually says — `evals/w2/results/20260927T052039Z.json`: 55 cases, 15 failures, every single one a cache miss on call #1, one shared hash for all of them, recorded `590c94c618a1e64c`, now `bac1bd81a188e1a2`. And here's the part I'd put on a slide: every rubric rate in that failing run is still 1.000. schema_valid, citation_present, no_unapproved_write, value_located, factually_consistent — all perfect. A gate that only checked score thresholds would have shipped that prompt green. The prompt in question changed 'Copy each value EXACTLY as printed — keep `<0.01`, `negative`, `trace`, and never round' into 'rounding to two decimal places where that reads more cleanly', which corrupts real lab results: `<0.01` is a value, and 5.44 and 5.4 collapse. So the cache miss isn't a quality claim, it's a refusal to make a stale one — it says you changed the model-facing surface and nobody re-scored the outcome. `replay.py` is explicit that a miss is fatal and never a live call and never a silent pass. The cost is exactly what you're describing: it's noisy, a typo fix in the prompt is 15 red cases, and the unblock is re-recording. The 15 aren't random, either — all 10 EX cases, plus CT-01/03/04 and AD-03/08, which is every case that reads a document. The whole extraction category collapses in one stroke because they share one surface.",
   "No — the gate caught the real regression. The scores dropped and the coverage-collapse check fired because three categories stopped being measured, which is exactly what the gate is designed to detect.",
   "So your gate's answer to every prompt change is 'go re-record'. Walk me through what stops a tired engineer at 2am from re-recording a genuinely worse prompt and shipping it green. And don't say code review unless you can tell me what a reviewer sees in a 35-file recording diff."],
  ["I'm your grader now, and I'm not going to touch your prompt. I'm going to change the retrieval ranking upstream of that call. Then I'm going to swap a model version in config. Then I'm going to edit a rubric. Which of those does your gate stop, and which does it wave through?",
   "Model swap: stopped hard. `model` is in the surface key, so that's 55 cache misses, not 15 — every case in the suite. Retrieval ranking: waved through, and this is a bigger hole than the one I demoed. Ranking changes what goes into `messages`, `messages` isn't hashed, so the recording still hits and the gate runs green while the answer quietly gets worse. Some of that would be caught downstream by output rubrics — `citation_present` and `value_located` would fail if the right passage stopped being retrieved at all — but a subtler re-ordering that still produces a plausible citation passes clean. Rubric edit: waved through completely, because `run_gate.py` isn't hashed by anything. What I have against those two is weaker than the hash: the 5-case holdout, `tools/live_smoke.py` making one real call per external path, and 408 unit tests. That smoke tool exists because of a sibling hole worth telling you about — `output_config` was passed the format object without its `{'format': {...}}` wrapper for a week, so every real vision call returned HTTP 400 while 399 tests, 55 gated cases and the holdout all passed. Recordings were made through the same broken code, so the gate was perfectly consistent with itself and perfectly wrong about reality. If you make me rank the three: ranking is the one that reaches a patient, because it degrades the answer without anything turning red, and it's what I'd fix this week by putting the retrieved context into the surface key or into a checked-in fixture so a ranking change becomes a visible diff.",
   "Any change to the request surface produces a cache miss, and a cache miss is a hard failure — so all three would be caught. The gate is designed so that nothing about the model interaction can change silently.",
   "Your gate was green for a week while every real vision call 400'd, because the recordings were made through the broken code. That's the same failure as this one: a closed loop agreeing with itself. What's the general fix, and why isn't one live smoke call per path just the next version of the same trap?"]
]]
];

/* ============================ RENDER ============================ */
const $=(s,r=document)=>r.querySelector(s);
const stage=$("#stage"), notesEl=$("#notes"), dotsEl=$("#dots");
let i=0, showNotes=true, t0=null, tick=null;

// A missing screenshot degrades to a labelled placeholder. The handler is attached in attachShots() rather
// than as an inline onerror=: an attribute's value is HTML-decoded before it is parsed as JS, so an
// apostrophe anywhere in the description closed the string early and the fallback silently never ran.
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function shotHTML(src,desc){
  return `<div class="shot"><img src="${esc(src)}" alt="" data-desc="${esc(desc)}"></div>`;
}
function attachShots(){
  stage.querySelectorAll(".shot img").forEach(img=>{
    const fail=()=>{img.parentNode.innerHTML=
      `<div class="ph"><div class="f">${esc(img.getAttribute("src"))}</div><div class="d">${esc(img.dataset.desc||"")}</div></div>`};
    img.addEventListener("error",fail);
    if(img.complete&&!img.naturalWidth)fail();   // already failed before this listener existed
  });
}

function render(){
  const s=SLIDES[i];
  let h=`<div class="deck"><p class="eyebrow">${s.eyebrow}<span class="tick">${s.t}s</span>${s.cut?'<span class="tick" style="color:var(--fail)">optional — cut for 5 min</span>':''}</p>`;
  if(s.h1) h+=`<h1>${s.h1}</h1>`;
  if(s.h2) h+=`<h2>${s.h2}</h2>`;
  if(s.sub) h+=`<p class="sub">${s.sub}</p>`;
  if(s.stat) h+=`<div class="stat">${s.stat.map(([n,l])=>`<div><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>`;
  if(s.rub) h+=`<div class="wrap-x"><table class="rub"><thead><tr><th>Rubric</th><th>Floor</th></tr></thead><tbody>${s.rub.map(([k,v])=>`<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("")}</tbody></table></div>`;
  if(s.term) h+=`<div class="wrap-x"><pre class="term">${T[s.term]}</pre></div>${s.cap?`<p class="cap">${s.cap}</p>`:""}`;
  if(s.shot) h+=shotHTML(s.shot[0],s.shot[1]);
  if(s.pts) h+=`<ul class="pts">${s.pts.map(p=>`<li>${p}</li>`).join("")}</ul>`;
  if(s.grid) h+=`<div class="grid2">${s.grid.map(([k,v])=>`<div><p class="eyebrow" style="margin-bottom:7px">${k}</p><p style="margin:0;color:var(--ink-2);font-size:15.5px;line-height:1.55">${v}</p></div>`).join("")}</div>`;
  if(s.quote) h+=`<p class="quote">${s.quote}</p>`;
  h+=`</div>`;
  stage.innerHTML=h;
  attachShots();

  notesEl.hidden=!showNotes;
  notesEl.innerHTML=`<h3>Read aloud — slide ${i+1} · ${s.t}s</h3>
    <p class="script">${s.script}</p>
    <div class="cue"><span class="tag">Click after</span><span class="txt">“${s.cue}”</span></div>
    ${s.doing?`<p class="doing"><b>On screen:</b> ${s.doing}</p>`:""}`;

  $("#count").textContent=`${i+1} / ${SLIDES.length}`;
  $("#bar i").style.width=((i+1)/SLIDES.length*100)+"%";
  [...dotsEl.children].forEach((d,n)=>d.setAttribute("aria-current",n===i?"true":"false"));
  $("#bPrev").disabled=i===0; $("#bNext").disabled=i===SLIDES.length-1;
  window.scrollTo({top:0,behavior:"instant"});
}

SLIDES.forEach((s,n)=>{
  const b=document.createElement("button");
  b.type="button"; b.title=`${n+1}. ${s.h1||s.h2}`;
  b.addEventListener("click",()=>{i=n;render()});
  dotsEl.appendChild(b);
});

function go(d){ const n=i+d; if(n>=0&&n<SLIDES.length){i=n;render();} }

/* timer */
const target=SLIDES.filter(s=>!s.cut).reduce((a,s)=>a+s.t,0);
const targetFull=SLIDES.reduce((a,s)=>a+s.t,0);
const fmt=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`;
function startClock(){
  if(tick) return;
  t0=performance.now();
  tick=setInterval(()=>{
    const s=Math.floor((performance.now()-t0)/1000);
    const el=$("#clock");
    el.textContent=`${fmt(s)} / ${fmt(target)} core · ${fmt(targetFull)} full`;
    el.classList.toggle("over", s>target);
  },1000);
}
$("#bNext").addEventListener("click",()=>{startClock();go(1)});
$("#bPrev").addEventListener("click",()=>go(-1));
$("#bNotes").addEventListener("click",e=>{showNotes=!showNotes;e.currentTarget.setAttribute("aria-pressed",showNotes);render()});
$("#bTheme").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",next);
});

/* interview overlay */
const iv=$("#iv");
iv.innerHTML=`<div class="inner"><header><h2>Interview prep</h2><span class="spacer" style="flex:1"></span>
  <button class="ctl" id="ivClose">Close</button></header>
  ${IV.map(([g,qs])=>`<section class="qgroup"><h3>${g}</h3>${qs.map(([q,good,bad,probe])=>`
    <details class="q"><summary>${q}</summary><div class="body">
      <div class="ans good"><span class="lab">Strong answer</span><p>${good}</p></div>
      <div class="ans bad"><span class="lab">Trap answer</span><p>${bad}</p></div>
      <div class="ans probe"><span class="lab">Likely follow-up</span><p>${probe}</p></div>
    </div></details>`).join("")}</section>`).join("")}
  <p class="hint">Press <kbd>I</kbd> or Esc to go back to the deck.</p></div>`;
function toggleIv(force){
  const open = force!==undefined?force:iv.hidden;
  iv.hidden=!open; document.body.style.overflow=open?"hidden":"";
  $("#bIv").setAttribute("aria-pressed",open);
}
$("#bIv").addEventListener("click",()=>toggleIv());
$("#ivClose").addEventListener("click",()=>toggleIv(false));

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea")) return;
  const k=e.key.toLowerCase();
  if(!iv.hidden){ if(k==="escape"||k==="i") toggleIv(false); return; }
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();startClock();go(1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(-1)}
  else if(k==="n"){showNotes=!showNotes;$("#bNotes").setAttribute("aria-pressed",showNotes);render()}
  else if(k==="i"){toggleIv(true)}
  else if(k==="t"){$("#bTheme").click()}
  else if(k==="r"){clearInterval(tick);tick=null;$("#clock").textContent="0:00";$("#clock").classList.remove("over")}
  else if(k==="home"){i=0;render()}
  else if(k==="end"){i=SLIDES.length-1;render()}
});

render();
</script>
</body>
</html>
