# The agent is its own Python distribution, not loose scripts inside the OpenEMR fork: everything importable lives
# in the `copilot` package, so `pip install ./agent` gives you a working agent with no reference to the PHP around
# it. Runtime pins stay in requirements.txt as well, because the Dockerfile installs them in a separate layer that
# only re-runs when the pins change (copying the source would bust that cache on every edit).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openemr-clinical-copilot"
version = "1.0.0"
description = "Read-only SMART on FHIR clinical co-pilot for OpenEMR: verified answers at the point of care."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
# READ FROM requirements.txt, not copied from it. This list was hand-maintained and silently stopped at the
# Week 1 set: pdfplumber, pypdfium2, pytesseract, pillow, rank-bm25, voyageai, langgraph and python-multipart
# were all added to requirements.txt and never here, so `pip install ./agent` produced a distribution that
# imported and then raised at the first document upload. One source of truth makes that drift impossible
# rather than merely fixed once.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
copilot-alerts = "copilot.alerts:main"

[tool.setuptools]
packages = ["copilot"]

[tool.setuptools.package-data]
copilot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/ has no __init__.py, so pytest would put tests/ on sys.path and not agent/. `python -m pytest` happens to
# work because it adds the cwd; this makes bare `pytest` work too.
pythonpath = ["."]
